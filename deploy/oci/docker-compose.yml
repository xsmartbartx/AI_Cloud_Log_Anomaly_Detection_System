# Linegist on an OCI VM: Postgres, a one-off migration, and the app.
#
# Two ways to put it on the internet:
#  A) The VM already runs Caddy (or nginx): leave the "standalone" profile off. The app listens on 127.0.0.1:${LINEGIST_PORT:-3100}
#     only, and your existing proxy sends linegist.<domain> to it. See README "If the VM already runs Caddy".
#       docker compose --env-file .env up -d --build
#  B) A fresh VM: turn on the "standalone" profile to also start Caddy, which gets the HTTPS certificate itself.
#       docker compose --env-file .env --profile standalone up -d --build
#
# The database is never published. Only 127.0.0.1 (and, in mode B, Caddy on 80/443) accept connections.

# Rotate container logs so they cannot fill the disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: linegist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: linegist
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linegist -d linegist"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ../..
      dockerfile: apps/sentinel-web/Dockerfile
      target: migrate
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-}
    restart: "no"
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://linegist:${POSTGRES_PASSWORD}@db:5432/linegist

  app:
    build:
      context: ../..
      dockerfile: apps/sentinel-web/Dockerfile
      target: runtime
      args:
        NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
        NEXT_PUBLIC_CLERK_SIGN_IN_URL: ${NEXT_PUBLIC_CLERK_SIGN_IN_URL:-}
    image: linegist:latest
    logging: *logging
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: .env
    ports:
      # Loopback only: a proxy on this machine can reach it, the internet cannot.
      - "127.0.0.1:${LINEGIST_PORT:-3100}:3000"
    environment:
      # Built here so the password has one source; overrides anything of the same name in .env.
      DATABASE_URL: postgresql://linegist:${POSTGRES_PASSWORD}@db:5432/linegist
      APP_URL: https://${LINEGIST_HOST}
      NODE_ENV: production
      PG_POOL_MAX: ${PG_POOL_MAX:-10}

  caddy:
    image: caddy:2
    profiles: ["standalone"]
    logging: *logging
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    environment:
      LINEGIST_HOST: ${LINEGIST_HOST:?set LINEGIST_HOST in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  dbdata:
  caddy_data:
  caddy_config:
